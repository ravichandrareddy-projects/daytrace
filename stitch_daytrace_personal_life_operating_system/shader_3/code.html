<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SHADER_START:ANIMATION_49 class="fixed inset-0 w-full h-full" -->
<div class="fixed inset-0 w-full h-full" style="display:block;">
<canvas id="shader-canvas-ANIMATION_49" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_49');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;
varying vec2 v_texCoord;

// Smooth cyclical spectral rainbow palette (matching the Stitch generation border flow)
vec3 spectralPalette(float t) {
    // Elegant luminous spectrum: cyan -> blue -> violet -> magenta -> peach -> yellow -> mint -> cyan
    vec3 a = vec3(0.68, 0.72, 0.78);
    vec3 b = vec3(0.38, 0.35, 0.38);
    vec3 c = vec3(1.0, 1.0, 1.0);
    vec3 d = vec3(0.0, 0.33, 0.67);
    return a + b * cos(6.2831853 * (c * t + d));
}

// Distance to rounded rectangle boundary
float roundedBoxSDF(vec2 p, vec2 b, float r) {
    vec2 q = abs(p) - b + vec2(r);
    return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
}

// Perimeter parameterization (t in 0..1 along the border loop)
float getBorderT(vec2 p, vec2 halfSize, float r) {
    // p centered, halfSize is box half-width and half-height
    float w = halfSize.x * 2.0;
    float h = halfSize.y * 2.0;
    float perimeter = 2.0 * (w + h);
    
    // Top-left corner to top edge, moving clockwise:
    // We want the flow from left-to-right across the edges, or sweeping around the perimeter
    float angle = atan(p.y, p.x); // -PI to PI
    float normAngle = (angle + 3.14159265) / (2.0 * 3.14159265);
    return normAngle;
}

void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    // Invert Y for correct screen orientation
    uv.y = 1.0 - uv.y;

    // Aspect ratio correction
    float aspect = u_resolution.x / u_resolution.y;
    vec2 p = uv - 0.5;
    p.x *= aspect;

    vec2 halfSize = vec2(0.5 * aspect, 0.5);

    // Porcelain crisp white base background (#FAF9FE)
    vec3 baseColor = vec3(0.982, 0.980, 0.995);

    // Border perimeter metrics
    float cornerRadius = 0.08 * aspect;
    float d = roundedBoxSDF(p, halfSize - vec2(0.005 * aspect, 0.005), cornerRadius);

    // Distance from the outer edge inward:
    // Inside the card, d is negative. -d is distance from perimeter edge inwards.
    float distFromEdge = max(-d, 0.0);

    // Continuous flow coordinate: sweeping from left to right along horizontal & wrapping edges
    // As seen in the reference {{DATA:IMAGE:IMAGE_6}}: the luminous rainbow glow hugs the bottom/side corners and edges
    float flowSpeed = 0.22;
    float flow = fract(uv.x * 0.85 - uv.y * 0.15 - u_time * flowSpeed);

    // Spectral color from the moving wave
    vec3 rainbowCol = spectralPalette(flow);

    // Edge glow thickness: concentrated in outer 35-65px (feathered inward)
    // Strongest right along the bottom, corners, and perimeter
    float edgeGlow = smoothstep(0.18, 0.002, distFromEdge);
    
    // Extra concentration along bottom border and bottom-left / bottom-right corners (like in the screenshot)
    float bottomConcentration = smoothstep(0.4, 0.98, uv.y) * 1.4;
    float topConcentration = smoothstep(0.15, 0.0, uv.y) * 0.5;
    float sideConcentration = (smoothstep(0.12, 0.0, uv.x) + smoothstep(0.88, 1.0, uv.x)) * 0.8;
    
    float totalEdgeWeight = edgeGlow * (0.85 + bottomConcentration + sideConcentration + topConcentration);

    // Subtle inner ambient reflection: soft diffuse haze drifting across bottom-mid
    float ambientHaze = smoothstep(0.45, 0.0, length(uv - vec2(0.5, 0.85))) * 0.18;

    // Intensity calibration: noticeable, vibrant, yet elegant behind UI
    float finalAlpha = clamp(totalEdgeWeight * 0.55 + ambientHaze, 0.0, 0.88);

    // Compose final pixel
    vec3 finalColor = mix(baseColor, rainbowCol, finalAlpha);

    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
</div>
<!-- STITCH_SHADER_END:ANIMATION_49 -->
</body>
</html>
